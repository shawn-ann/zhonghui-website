# 静态站点：www.beijingzhonghui.com
server {
    listen 80;
    server_name www.beijingzhonghui.com;

    root /srv/site/current;
    index index.html;

    # 发布失败时软链仍指向旧版本；没有构建时返回 404。
    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        try_files $uri =404;
        # 资源文件名不带 hash，重新构建会原地覆盖；必须让浏览器回源校验，避免长期缓存旧样式/脚本。
        add_header Cache-Control "no-cache";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}

# 裸域跳转到 www
server {
    listen 80;
    server_name beijingzhonghui.com;
    return 301 http://www.beijingzhonghui.com$request_uri;
}

# CMS / 后台：admin.beijingzhonghui.com
server {
    listen 80;
    server_name admin.beijingzhonghui.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://cms:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

