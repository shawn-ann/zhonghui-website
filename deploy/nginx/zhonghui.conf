# 容器内静态站 Nginx
#
# 不包含任何域名：宿主机 Nginx 负责域名、TLS 和 admin 域名，
# 本容器只提供静态文件，固定监听 80，由 compose 映射到 127.0.0.1:8080。
server {
    listen 80 default_server;
    server_name _;

    root /srv/site/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        try_files $uri =404;
        # 资源文件名不带 hash，重新构建会原地覆盖；必须让浏览器回源校验。
        add_header Cache-Control "no-cache";
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
