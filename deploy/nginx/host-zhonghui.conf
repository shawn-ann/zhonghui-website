# 中惠官网 — 宿主机 Nginx 配置模板
#
# 由 deploy/setup-host-nginx.sh 用 .env 中的 SITE_DOMAIN / ADMIN_DOMAIN / CERT_NAME
# 替换 __SITE_DOMAIN__ / __ADMIN_DOMAIN__ / __CERT_NAME__ 后安装到：
#   /etc/nginx/conf.d/zhonghui-cms.conf
#
# 作用：
#   1. 宿主机 Nginx 终止 80/443 和 TLS；
#   2. 前端域名转发到 Docker 内 Nginx（127.0.0.1:8080）；
#   3. 后台域名直接转发到 CMS（127.0.0.1:3010）；
#   4. ACME challenge 由本机 webroot 提供，供 Certbot 续期。

map $http_upgrade $zhonghui_connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP：ACME 验证 + 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name __SITE_DOMAIN__ __ADMIN_DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 前端：HTTPS -> 容器内 Nginx（静态站）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SITE_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZHONGHUI_SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# 后台：HTTPS -> CMS（127.0.0.1:3010）
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __ADMIN_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__CERT_NAME__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZHONGHUI_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhonghui_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
