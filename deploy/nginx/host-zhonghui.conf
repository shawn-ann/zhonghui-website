# 中惠官网 — 宿主机 Nginx 配置
#
# 安装位置：/etc/nginx/conf.d/zhonghui.conf
# 作用：
#   1. 宿主机 Nginx 终止 80/443 和 TLS；
#   2. 转发到 Docker 内的 Nginx（127.0.0.1:8080）；
#   3. 提供 ACME HTTP-01 challenge 目录，供 Certbot 自动续期。
#
# 域名、证书路径按实际环境修改；可用 deploy/setup-host-nginx.sh 自动生成。

map $http_upgrade $zhonghui_connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP：Let's Encrypt 验证 + 跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name www.beijingzhonghui.com admin.beijingzhonghui.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 裸域跳转到 www
server {
    listen 80;
    listen [::]:80;
    server_name beijingzhonghui.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://www.beijingzhonghui.com$request_uri;
    }
}

# 官网：HTTPS -> 容器内 Nginx
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.beijingzhonghui.com;

    ssl_certificate     /etc/letsencrypt/live/www.beijingzhonghui.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.beijingzhonghui.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZHONGHUI_SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# 管理后台：HTTPS -> 容器内 Nginx -> cms:3000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.beijingzhonghui.com;

    ssl_certificate     /etc/letsencrypt/live/www.beijingzhonghui.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.beijingzhonghui.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZHONGHUI_SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhonghui_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
