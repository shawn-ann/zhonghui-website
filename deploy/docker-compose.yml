name: zhonghui

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhonghui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhonghui_pw}
      POSTGRES_DB: ${POSTGRES_DB:-zhonghui_cms}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhonghui} -d ${POSTGRES_DB:-zhonghui_cms}"]
      interval: 5s
      timeout: 5s
      retries: 20

  builder:
    build:
      context: ../cms
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.zhonghui.com}
    image: zhonghui-cms
    restart: unless-stopped
    command: node generator/builder.mjs
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zhonghui}:${POSTGRES_PASSWORD:-zhonghui_pw}@postgres:5432/${POSTGRES_DB:-zhonghui_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      SITE_RELEASES_DIR: /app/releases
      SITE_KEEP_RELEASES: "5"
      NODE_ENV: production
      TZ: Asia/Shanghai
    volumes:
      - cms-media:/app/media
      - site-releases:/app/releases

  cms:
    build:
      context: ../cms
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.zhonghui.com}
    image: zhonghui-cms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      builder:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-zhonghui}:${POSTGRES_PASSWORD:-zhonghui_pw}@postgres:5432/${POSTGRES_DB:-zhonghui_cms}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?set PAYLOAD_SECRET in .env}
      SITE_RELEASES_DIR: /app/releases
      SITE_KEEP_RELEASES: "5"
      BUILDER_URL: http://builder:4000
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.zhonghui.com}
      TZ: Asia/Shanghai
    volumes:
      - cms-media:/app/media
      - site-releases:/app/releases
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - cms
    # 只绑定本机，供宿主机 Nginx 反向代理；宿主机 Nginx 负责 80/443 和证书。
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - site-releases:/srv/site:ro
      - ./nginx/zhonghui.conf:/etc/nginx/conf.d/default.conf:ro
      # - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  cms-media:
  site-releases:
