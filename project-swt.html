<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWT 赴美带薪实习 — 中惠文化</title>
  <style>
    :root {
      --deep-blue: #1A4B7A;
      --bright-blue: #4A90E2;
      --light-blue: #E5F0FA;
      --pale-blue: #D0E7F8;
      --gray-blue: #5A7A9A;
      --dark-text: #44546A;
      --white: #FFFFFF;
      --border: #E1E9F2;
      --orange: #EE822F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
      color: var(--dark-text);
      line-height: 1.6;
      background: var(--white);
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

    /* ===== 顶部导航栏 ===== */
    header {
      background: linear-gradient(120deg, var(--deep-blue) 0%, #24598f 100%);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 10px rgba(26,75,122,0.25);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .logo img { display: block; height: 44px; width: auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
    .nav-menu { display: flex; list-style: none; gap: 28px; align-items: center; }
    .nav-menu > li { position: relative; }
    .nav-menu > li > a {
      font-size: 15px; color: #d7e6f5; font-weight: 500; padding: 6px 0;
      display: flex; align-items: center; gap: 4px; transition: color .2s;
    }
    .nav-menu > li > a:hover { color: #fff; }
    .nav-menu > li > a.active { color: #fff; }
    .nav-menu > li > a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
      height: 3px; border-radius: 2px; background: var(--bright-blue);
    }
    .nav-menu .caret { font-size: 10px; opacity: .8; }
    .nav-menu .dropdown {
      position: absolute; top: 100%; left: -12px; min-width: 172px;
      background: var(--white); border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 24px rgba(26,75,122,0.18); overflow: hidden;
      opacity: 0; visibility: hidden; transform: translateY(8px);
      transition: opacity .2s, transform .2s, visibility .2s;
      padding: 6px 0; z-index: 200;
    }
    .nav-menu > li:hover .dropdown,
    .nav-menu > li:focus-within .dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
    .nav-menu .dropdown a {
      display: block; padding: 11px 20px; font-size: 14px; color: var(--deep-blue);
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .nav-menu .dropdown a:hover { background: var(--light-blue); color: var(--bright-blue); }
    .nav-lang { font-size: 14px; color: #9db6cf; display: flex; gap: 6px; }
    .nav-lang .sep { color: #5a7a9a; }
    .nav-lang a { color: #9db6cf; }
    .nav-lang a:hover { color: #fff; }
    .nav-lang a.active { color: #fff; font-weight: 600; }

    /* ===== Banner ===== */
    .banner {
      height: 300px; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; background-size: cover; background-position: center;
    }
    .banner.bg-gradient { background: linear-gradient(135deg, #0e3d63 0%, #1A4B7A 50%, #3372b8 100%); }
    .banner::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#ffffff22 1px, transparent 1px); background-size: 28px 28px; }
    .banner-note { position: relative; z-index: 1; color: rgba(255,255,255,.7); font-size: 15px; letter-spacing: 2px; padding: 8px 20px; border: 1px dashed rgba(255,255,255,.4); border-radius: 6px; }

    /* ===== 区块通用 ===== */
    .section { padding: 64px 0; }
    .section-alt { background: var(--light-blue); }
    .section-title { text-align: center; margin-bottom: 36px; }
    .section-title h2 { font-size: 30px; color: var(--deep-blue); font-weight: 700; }

    /* ===== 概述块 ===== */
    .overview-text { max-width: 900px; margin: 0 auto; font-size: 16px; color: var(--dark-text); text-align: center; }
    .overview-kv { display: grid; gap: 24px; margin-top: 36px; }
    .kv-item { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 24px; text-align: center; }
    .kv-item .k { font-size: 13px; color: var(--gray-blue); }
    .kv-item .v { font-size: 22px; font-weight: 700; color: var(--deep-blue); margin-top: 6px; }

    /* ===== 图标卡片网格块 ===== */
    .feat-grid { display: grid; gap: 28px; }
    .feat-card {
      background: var(--white); border-radius: 12px; border: 1px solid var(--border);
      padding: 30px; text-align: center; transition: transform .25s, box-shadow .25s;
    }
    .feat-card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(26,75,122,0.14); }
    .feat-card .icon { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 16px; background: var(--light-blue); color: var(--deep-blue); display: flex; align-items: center; justify-content: center; font-size: 26px; }
    .feat-card h3 { font-size: 18px; color: var(--deep-blue); }
    .feat-card p { font-size: 14px; color: var(--gray-blue); margin-top: 10px; }

    /* ===== 通用双栏列表块 ===== */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .panel { background: var(--white); border-radius: 12px; border: 1px solid var(--border); padding: 30px 34px; }
    .panel h3 { font-size: 19px; color: var(--deep-blue); margin-bottom: 16px; padding-left: 12px; border-left: 4px solid var(--bright-blue); }
    .panel ul { list-style: none; }
    .panel li { font-size: 14.5px; color: var(--dark-text); padding: 7px 0; position: relative; padding-left: 18px; }
    .panel li::before { content: "·"; position: absolute; left: 0; color: var(--bright-blue); font-weight: 700; }
    .adv-panel ul li::before { color: var(--orange); }

    /* ===== 报名流程（两分栏） ===== */
    .process { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: stretch; }
    .process-stages { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 26px 30px; }
    .process-stages h3 { font-size: 17px; color: var(--deep-blue); margin-bottom: 16px; padding-left: 12px; border-left: 4px solid var(--bright-blue); }
    .stage { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
    .stage:last-child { border-bottom: none; }
    .stage .no { flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--light-blue); color: var(--deep-blue); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; margin-top: 2px; }
    .stage .name { font-size: 15px; font-weight: 600; color: var(--deep-blue); display: block; }
    .stage .desc { font-size: 12.5px; color: var(--gray-blue); display: block; margin-top: 2px; line-height: 1.5; }
    .process-chain { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 26px 30px; }
    .process-chain h3 { font-size: 17px; color: var(--deep-blue); margin-bottom: 16px; padding-left: 12px; border-left: 4px solid var(--bright-blue); }
    .chain-item { display: flex; align-items: center; gap: 14px; padding: 8px 0; }
    .chain-item .ic { flex: 0 0 36px; height: 36px; border-radius: 8px; background: var(--light-blue); color: var(--deep-blue); display: flex; align-items: center; justify-content: center; font-size: 17px; }
    .chain-item .name { font-size: 15px; color: var(--deep-blue); font-weight: 600; }

    /* ===== 岗位介绍（Tab） ===== */
    .job-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
    .job-tabs button { border: 1px solid var(--bright-blue); background: var(--white); color: var(--bright-blue); padding: 8px 28px; border-radius: 24px; font-size: 14px; cursor: pointer; transition: all .2s; }
    .job-tabs button.active, .job-tabs button:hover { background: var(--deep-blue); color: #fff; border-color: var(--deep-blue); }
    .job-group { background: var(--white); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .job-hero { height: 260px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; letter-spacing: 1px; background-size: cover; background-position: center; }
    .job-body { padding: 30px 34px; }
    .job-body h3 { font-size: 18px; color: var(--deep-blue); margin-bottom: 14px; }
    .job-chip { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .job-chip span { background: var(--light-blue); color: var(--deep-blue); font-weight: 600; padding: 8px 18px; border-radius: 20px; font-size: 14px; }
    .job-desc { font-size: 15px; color: var(--dark-text); line-height: 1.9; }
    .job-warn { margin-top: 22px; background: #fff6ec; border-left: 4px solid var(--orange); border-radius: 8px; padding: 16px 20px; font-size: 14px; color: #8a5a1f; line-height: 1.8; }
    .job-warn strong { color: var(--orange); }

    /* ===== 页脚 ===== */
    footer { background: var(--deep-blue); color: #cfdff0; }
    .footer-grid { max-width: 1180px; margin: 0 auto; padding: 56px 24px 32px; display: grid; grid-template-columns: 1.2fr 2fr 1fr; gap: 40px; }
    .footer-brand img { display: block; margin-bottom: 14px; height: 110px; width: auto; }
    .footer-brand .zh { font-size: 22px; font-weight: 700; color: #fff; }
    .footer-brand .en { font-size: 12px; letter-spacing: 2px; color: #9db6cf; margin-top: 4px; }
    .footer-info p { font-size: 14px; margin-bottom: 12px; color: #d7e6f5; }
    .footer-info .label { color: #9db6cf; margin-right: 8px; }
    .footer-copy { border-top: 1px solid rgba(255,255,255,.12); padding: 20px 24px; text-align: center; font-size: 13px; color: #9db6cf; }
    .footer-qr { text-align: center; }
    .footer-qr h4 { color: #fff; font-size: 16px; margin-bottom: 16px; }
    .qr-box { display: flex; gap: 16px; justify-content: center; }
    .qr-item .qr { width: 92px; height: 92px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--deep-blue); font-size: 11px; text-align: center; padding: 6px; margin-bottom: 8px; }
    .qr-item p { font-size: 13px; color: #d7e6f5; }

    @media (max-width: 900px) {
      .feat-grid, .overview-kv { grid-template-columns: repeat(2, 1fr); }
      .two-col, .process, .footer-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

    banner(b) {
      const bg = b.data.bg;
      const style = bg && bg !== "gradient" ? `style="background-image:url('${esc(bg)}')"` : "";
      return `<section class="banner ${bg === "gradient" || !bg ? "bg-gradient" : ""}" ${style}>${b.data.note ? `<span class="banner-note">${esc(b.data.note)}</span>` : ""}</section>`;
    },
    overview(b) {
      const d = b.data;
      const kv = (d.kv || []).map(k => `<div class="kv-item"><div class="k">${esc(k.k)}</div><div class="v">${esc(k.v)}</div></div>`).join("");
      return `<section class="section"><div class="container">
        <div class="section-title"><h2>${esc(d.title)}</h2></div>
        <p class="overview-text">${esc(d.text)}</p>
        ${kv ? `<div class="overview-kv" style="grid-template-columns:repeat(${d.kvCols || kv.length},1fr);">${kv}</div>` : ""}
      </div></section>`;
    },
    features(b) {
      const d = b.data;
      const cols = d.cols || 3;
      const cards = (d.items || []).map(f => `<div class="feat-card">
        <div class="icon">${esc(f.icon)}</div><h3>${esc(f.title)}</h3><p>${esc(f.desc)}</p>
      </div>`).join("");
      return `<section class="section section-alt"><div class="container">
        <div class="section-title"><h2>${esc(d.title)}</h2></div>
        <div class="feat-grid" style="grid-template-columns:repeat(${cols},1fr);">${cards}</div>
      </div></section>`;
    },
    "panel-list"(b) {
      const d = b.data;
      const cls = d.accent === "orange" ? "panel adv-panel" : "panel";
      const cols = (d.panels || []).map(p => `
        <div class="${cls}"><h3>${esc(p.heading)}</h3><ul>${(p.items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`).join("");
      return `<section class="section" id="${d.id || ""}"><div class="container">
        <div class="section-title"><h2>${esc(d.title)}</h2></div>
        <div class="two-col">${cols}</div>
      </div></section>`;
    },
    process(b) {
      const d = b.data;
      const stages = (d.stages || []).map((s, i) => {
        const last = i === (d.stages.length - 1);
        return `<div class="stage"><span class="no" ${last ? `style="background:var(--deep-blue);color:#fff;"` : ""}>${i+1}</span><div><span class="name">${esc(s.name)}</span><span class="desc">${esc(s.desc)}</span></div></div>`;
      }).join("");
      const chain = (d.chain || []).map(c => `<div class="chain-item"><span class="ic">${esc(c.icon)}</span><span class="name">${esc(c.name)}</span></div>`).join("");
      return `<section class="section section-alt"><div class="container">
        <div class="section-title"><h2>${esc(d.title)}</h2></div>
        <div class="process">
          <div class="process-stages"><h3>${esc(d.stagesTitle)}</h3>${stages}</div>
          <div class="process-chain"><h3>${esc(d.chainTitle)}</h3>${chain}</div>
        </div>
      </div></section>`;
    },
    jobs(b) {
      const d = b.data;
      const list = collections[d.source] || [];
      const tabs = list.map((j, i) =>
        `<button data-tab="${i}" class="${i === 0 ? "active" : ""}">${esc(j.name)}</button>`).join("");
      const groups = list.map((j, i) => {
        const heroStyle = j.hero !== "gradient"
          ? `style="background:url('${esc(j.hero)}') center/cover no-repeat;"`
          : `style="background:linear-gradient(135deg,#4A90E2,#1A4B7A);"`;
        return `<div class="job-group" data-panel="${i}" ${i !== 0 ? `style="display:none;"` : ""}>
          <div class="job-hero" ${heroStyle}>${esc(j.heroLabel || "")}</div>
          <div class="job-body">
            <h3>${esc(j.chipsLabel || "岗位种类")}</h3>
            <div class="job-chip">${(j.chips||[]).map(c=>`<span>${esc(c)}</span>`).join("")}</div>
            <h3>${esc(j.descLabel || "岗位特点")}</h3>
            <p class="job-desc">${esc(j.desc || "")}</p>
            ${j.warn ? `<div class="job-warn"><strong>特别提醒：</strong>${esc(j.warn)}</div>` : ""}
          </div>
        </div>`;
      }).join("");
      return `<section class="section section-alt"><div class="container">
        <div class="section-title"><h2>${esc(d.title)}</h2></div>
        <div class="job-tabs">${tabs}</div>
        ${groups}
      </div></section>`;
    }
  };

  // ---------------- 渲染页面 ----------------
  function renderNav(nav) {
    const menu = nav.items.map(m => {
      const sub = m.children ? `<div class="dropdown">${m.children.map(c =>
        `<a href="${esc(c.link)}" class="${c.active ? "active" : ""}">${esc(c.label)}</a>`).join("")}</div>` : "";
      return `<li><a href="${esc(m.link)}" class="${m.active ? "active" : ""}">${esc(m.label)}${m.children ? ' <span class="caret">▾</span>' : ""}</a>${sub}</li>`;
    }).join("");
    document.getElementById("site-header").innerHTML = `
      <div class="container nav">
        <a class="logo" href="index.html"><img src="${esc(nav.logo)}" alt="中惠文化"></a>
        <ul class="nav-menu">${menu}</ul>
        <div class="nav-lang"><a class="active" href="#">${esc(nav.langCurrent)}</a><span class="sep">|</span><a href="#">${esc(nav.langOther)}</a></div>
      </div>`;
  }

  function renderBlocks(blocks) {
    document.getElementById("page").innerHTML = blocks
      .filter(b => renderers[b.type])
      .map(b => renderers[b.type](b)).join("");
    bindJobs();
  }

  function renderFooter(f) {
    const info = f.info.map(i => `<p><span class="label">${esc(i.label)}</span>${esc(i.text)}</p>`).join("");
    const qr = f.qrcodes.map(q => `
      <div class="qr-item"><div class="qr">${esc(q.text).replace(/\n/g,"<br>")}</div><p>${esc(q.title)}</p></div>`).join("");
    document.getElementById("site-footer").innerHTML = `
      <div class="footer-grid">
        <div class="footer-brand"><img src="${esc(f.logo)}" alt="中惠文化"></div>
        <div class="footer-info">${info}</div>
        <div class="footer-qr"><h4>关注我们</h4><div class="qr-box">${qr}</div></div>
      </div>
      <div class="footer-copy">${esc(f.copyright)}</div>`;
  }

  // 岗位 Tab 切换
  function bindJobs() {
    const btns = document.querySelectorAll('.job-tabs button');
    if (!btns.length) return;
    btns.forEach(btn => btn.addEventListener('click', () => {
      btns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.job-group').forEach(g => g.style.display = 'none');
      document.querySelector(`.job-group[data-panel="${btn.dataset.tab}"]`).style.display = 'block';
    }));
  }

  renderNav(pageConfig.nav);
  renderBlocks(pageConfig.blocks);
  renderFooter(pageConfig.footer);
  </script>
</body>
</html>
