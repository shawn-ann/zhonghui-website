<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案例分享 — 中惠文化</title>
  <style>
    :root {
      --deep-blue: #1A4B7A;
      --bright-blue: #4A90E2;
      --light-blue: #E5F0FA;
      --pale-blue: #D0E7F8;
      --gray-blue: #5A7A9A;
      --dark-text: #44546A;
      --white: #FFFFFF;
      --border: #E1E9F2;
      --orange: #EE822F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
      color: var(--dark-text);
      line-height: 1.6;
      background: var(--white);
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }

    /* ===== 顶部导航栏 ===== */
    header {
      background: linear-gradient(120deg, var(--deep-blue) 0%, #24598f 100%);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 10px rgba(26,75,122,0.25);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .logo img { display: block; height: 44px; width: auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }
    .nav-menu { display: flex; list-style: none; gap: 28px; align-items: center; }
    .nav-menu > li { position: relative; }
    .nav-menu > li > a {
      font-size: 15px; color: #d7e6f5; font-weight: 500; padding: 6px 0;
      display: flex; align-items: center; gap: 4px; transition: color .2s;
    }
    .nav-menu > li > a:hover { color: #fff; }
    .nav-menu > li > a.active { color: #fff; }
    .nav-menu > li > a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -2px;
      height: 3px; border-radius: 2px; background: var(--bright-blue);
    }
    .nav-menu .caret { font-size: 10px; opacity: .8; }
    .nav-menu .dropdown {
      position: absolute; top: 100%; left: -12px; min-width: 172px;
      background: var(--white); border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 24px rgba(26,75,122,0.18); overflow: hidden;
      opacity: 0; visibility: hidden; transform: translateY(8px);
      transition: opacity .2s, transform .2s, visibility .2s;
      padding: 6px 0; z-index: 200;
    }
    .nav-menu > li:hover .dropdown,
    .nav-menu > li:focus-within .dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
    .nav-menu .dropdown a {
      display: block; padding: 11px 20px; font-size: 14px; color: var(--deep-blue);
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .nav-menu .dropdown a:hover { background: var(--light-blue); color: var(--bright-blue); }
    .nav-lang { font-size: 14px; color: #9db6cf; display: flex; gap: 6px; }
    .nav-lang .sep { color: #5a7a9a; }
    .nav-lang a { color: #9db6cf; }
    .nav-lang a:hover { color: #fff; }
    .nav-lang a.active { color: #fff; font-weight: 600; }

    /* ===== Banner ===== */
    .banner {
      height: 300px; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; background-size: cover; background-position: center;
    }
    .banner.bg-gradient { background: linear-gradient(135deg, #0e3d63 0%, #1A4B7A 50%, #3372b8 100%); }
    .banner::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(#ffffff22 1px, transparent 1px); background-size: 28px 28px; }
    .banner-note { position: relative; z-index: 1; color: rgba(255,255,255,.7); font-size: 15px; letter-spacing: 2px; padding: 8px 20px; border: 1px dashed rgba(255,255,255,.4); border-radius: 6px; }

    /* ===== 区块通用 ===== */
    .section { padding: 56px 0; }
    .section-title { text-align: center; margin-bottom: 36px; }
    .section-title h2 { font-size: 30px; color: var(--deep-blue); font-weight: 700; }

    /* ===== 案例宫格（内容集合块） ===== */
    .case-grid { display: grid; gap: 18px; }
    .case-card {
      position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
      aspect-ratio: 1 / 1; display: block;
      background-size: cover; background-position: center;
      transition: transform .25s, box-shadow .25s;
    }
    .case-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(26,75,122,0.18); }
    .case-card .title {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 10px 12px; font-size: 13px; font-weight: 600; color: #fff;
      background: rgba(26,75,122,0.55);   /* 半透明遮罩 */
      backdrop-filter: blur(2px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ===== 分页 ===== */
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; flex-wrap: wrap; }
    .pagination button {
      border: 1px solid var(--border); background: var(--white); color: var(--deep-blue);
      min-width: 38px; height: 38px; padding: 0 10px; border-radius: 6px;
      cursor: pointer; font-size: 14px; transition: all .2s;
    }
    .pagination button:hover { border-color: var(--bright-blue); color: var(--bright-blue); }
    .pagination button.active { background: var(--deep-blue); color: #fff; border-color: var(--deep-blue); }
    .pagination button:disabled { opacity: .4; cursor: not-allowed; }
    .page-info { text-align: center; color: var(--gray-blue); font-size: 13px; margin-top: 14px; }

    /* ===== 页脚 ===== */
    footer { background: var(--deep-blue); color: #cfdff0; }
    .footer-grid { max-width: 1280px; margin: 0 auto; padding: 56px 24px 32px; display: grid; grid-template-columns: 1.2fr 2fr 1fr; gap: 40px; }
    .footer-brand img { display: block; margin-bottom: 14px; height: 110px; width: auto; }
    .footer-brand .zh { font-size: 22px; font-weight: 700; color: #fff; }
    .footer-brand .en { font-size: 12px; letter-spacing: 2px; color: #9db6cf; margin-top: 4px; }
    .footer-info p { font-size: 14px; margin-bottom: 12px; color: #d7e6f5; }
    .footer-info .label { color: #9db6cf; margin-right: 8px; }
    .footer-copy { border-top: 1px solid rgba(255,255,255,.12); padding: 20px 24px; text-align: center; font-size: 13px; color: #9db6cf; }
    .footer-qr { text-align: center; }
    .footer-qr h4 { color: #fff; font-size: 16px; margin-bottom: 16px; }
    .qr-box { display: flex; gap: 16px; justify-content: center; }
    .qr-item .qr { width: 92px; height: 92px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--deep-blue); font-size: 11px; text-align: center; padding: 6px; margin-bottom: 8px; }
    .qr-item p { font-size: 13px; color: #d7e6f5; }

    @media (max-width: 1000px) {
      .case-grid { grid-template-columns: repeat(4, 1fr) !important; }
    }
    @media (max-width: 600px) {
      .case-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
  </style>
</head>
<body>

  <header id="site-header"></header>
  <main id="page"></main>
  <footer id="site-footer"></footer>

  <script>
  /* =========================================================
     CMS 配置化内容模型 —— 案例分享列表页
     pageConfig 模拟后端返回值。
     列表页由「内容集合块 content-collection」渲染：
       source = cases 集合；grid 3排8列；每格=背景大图+半透明标题；分页。
     ========================================================= */

  // 案例集合（图文内容，模拟后端）
  const collections = {
    cases: [
      { title: "小曹同学的赴美之旅", cover: "linear-gradient(135deg,#4A90E2,#1A4B7A)", link: "case-detail.html?id=xiaocao" },
      { title: "小丁同学的逆袭故事", cover: "linear-gradient(135deg,#5A7A9A,#1A4B7A)", link: "case-detail.html?id=xiaoding" },
      { title: "SWT 2025 年 0 拒签记录", cover: "linear-gradient(135deg,#3372b8,#24598f)", link: "#" },
      { title: "德州营地体验感悟", cover: "linear-gradient(135deg,#24598f,#0e3d63)", link: "#" },
      { title: "我的第一次赴美带薪实习", cover: "linear-gradient(135deg,#4A90E2,#0e3d63)", link: "#" },
      { title: "ITP 会计岗位面试心得", cover: "linear-gradient(135deg,#EE822F,#C25E00)", link: "#" },
      { title: "营地里的马术时光", cover: "linear-gradient(135deg,#30C0B4,#0e5b54)", link: "#" },
      { title: "互惠生的美国家庭生活", cover: "linear-gradient(135deg,#E54C5E,#8c1d2a)", link: "#" },
      { title: "在四季酒店实习的每一天", cover: "linear-gradient(135deg,#44546A,#171f2b)", link: "#" },
      { title: "海边救生员的夏天", cover: "linear-gradient(135deg,#4A90E2,#1A4B7A)", link: "#" },
      { title: "里斯本 WYSTC 大会见闻", cover: "linear-gradient(135deg,#75BD42,#3c6e1b)", link: "#" },
      { title: "从英语小白到一签过签", cover: "linear-gradient(135deg,#5A7A9A,#24598f)", link: "#" },
      { title: "游乐园设备操作员手记", cover: "linear-gradient(135deg,#F2BA02,#a37a00)", link: "#" },
      { title: "旧金山自由行 30 天", cover: "linear-gradient(135deg,#3372b8,#0e3d63)", link: "#" },
      { title: "学员 Offer 展示合集", cover: "linear-gradient(135deg,#1A4B7A,#0e3d63)", link: "#" },
      { title: "我的美国室友们", cover: "linear-gradient(135deg,#E54C5E,#1A4B7A)", link: "#" },
      { title: "夏令营辅导员的日常", cover: "linear-gradient(135deg,#30C0B4,#1A4B7A)", link: "#" },
      { title: "面试培训复盘笔记", cover: "linear-gradient(135deg,#EE822F,#1A4B7A)", link: "#" },
      { title: "第一次见雇主的那一刻", cover: "linear-gradient(135deg,#75BD42,#1A4B7A)", link: "#" },
      { title: "厨房帮工的有趣经历", cover: "linear-gradient(135deg,#5A7A9A,#0e3d63)", link: "#" },
      { title: "拉斯维加斯打工周记", cover: "linear-gradient(135deg,#F2BA02,#C25E00)", link: "#" },
      { title: "我的寄宿家庭爸爸妈妈", cover: "linear-gradient(135deg,#E54C5E,#8c1d2a)", link: "#" },
      { title: "华盛顿特区环球记", cover: "linear-gradient(135deg,#3372b8,#1A4B7A)", link: "#" },
      { title: "SWT 全流程签证指南分享", cover: "linear-gradient(135deg,#44546A,#1A4B7A)", link: "#" },
      { title: "2026 救生员北京站培训", cover: "linear-gradient(135deg,#4A90E2,#24598f)", link: "#" },
      { title: "第一次超员上夜班", cover: "linear-gradient(135deg,#5A7A9A,#171f2b)", link: "#" }
      // 共 26 条，用于演示分页（每页 24 条 → 2 页）
    ]
  };

  const pageConfig = {
    title: "案例分享",
    nav: {
      logo: "img/logo.png",
      langCurrent: "中文", langOther: "EN",
      items: [
        { label: "首页", link: "index.html" },
        { label: "关于我们", link: "about.html" },
        { label: "项目介绍", link: "project-swt.html", children: [
            { label: "SWT 赴美带薪实习", link: "project-swt.html" },
            { label: "ITP 赴美专业实习", link: "#" },
            { label: "ICCP 赴美营地辅导员", link: "#" },
            { label: "Au Pair 赴美互惠生", link: "#" } ] },
        { label: "案例分享", link: "cases.html", active: true },
        { label: "资讯中心", link: "news.html" },
        { label: "联系我们", link: "contact.html" }
      ]
    },
    footer: {
      logo: "img/footLogo.png",
      info: [
        { label: "📍 地址：", text: "北京东城区绿景馨园东区12号楼" },
        { label: "📞 电话：", text: "010-64159286" },
        { label: "✉ 邮箱：", text: "info@zhonghui.com" },
        { label: "🌐 中文官网：", text: "www.chinaaupairs.com" },
        { label: "🌐 英文官网：", text: "www.aupaircn.com" }
      ],
      qrcodes: [
        { title: "公众号", text: "公众号\n二维码" },
        { title: "咨询微信", text: "咨询微信\n二维码" }
      ],
      copyright: "Copyright © 2026 中惠文化　·　京ICP备XXXXXXXX号"
    },
    blocks: [
      // ① Banner 大图块
      { type: "banner", data: { bg: "gradient", note: "[ 页面大图 ]" }, options: {} },
      // ② 内容集合块：案例宫格（source=cases, grid, 3排8列=每页24条）
      { type: "content-collection",
        data: {
          title: "案例分享",
          source: "cases",
          layout: "grid",      // grid | list
          cols: 4, rows: 3,    // 每页 4列 × 3排 = 12 条
          pageSize: 12
        },
        options: {} }
    ]
  };

  // ---------------- 渲染器 ----------------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const renderers = {
    banner(b) {
      const bg = b.data.bg;
      const style = bg && bg !== "gradient" ? `style="background-image:url('${esc(bg)}')"` : "";
      return `<section class="banner ${bg === "gradient" || !bg ? "bg-gradient" : ""}" ${style}>${b.data.note ? `<span class="banner-note">${esc(b.data.note)}</span>` : ""}</section>`;
    },
    "content-collection"(b) {
      return `<section class="section"><div class="container">
        <div class="section-title"><h2>${esc(b.data.title)}</h2></div>
        <div id="case-container"></div>
      </div></section>`;
    }
  };

  // ---------------- 内容集合块：数据 + 分页 + 渲染 ----------------
  let caseState = { page: 1, pageSize: 24, cols: 8, all: [] };

  function renderCasePage() {
    const cfg = pageConfig.blocks.find(x => x.type === "content-collection").data;
    const all = collections[cfg.source] || [];
    caseState.all = all;
    caseState.pageSize = cfg.pageSize || 24;
    caseState.cols = cfg.cols || 8;
    const totalPages = Math.max(1, Math.ceil(all.length / caseState.pageSize));
    if (caseState.page > totalPages) caseState.page = totalPages;
    const start = (caseState.page - 1) * caseState.pageSize;
    const pageItems = all.slice(start, start + caseState.pageSize);

    const cards = pageItems.map(c => `
      <a class="case-card" href="${esc(c.link || "#")}" style="background-image:${esc(c.cover)};">
        <span class="title">${esc(c.title)}</span>
      </a>`).join("");

    let pager = "";
    if (totalPages > 1) {
      let btns = `<button ${caseState.page === 1 ? "disabled" : ""} data-p="${caseState.page - 1}">‹</button>`;
      for (let i = 1; i <= totalPages; i++) {
        btns += `<button class="${i === caseState.page ? "active" : ""}" data-p="${i}">${i}</button>`;
      }
      btns += `<button ${caseState.page === totalPages ? "disabled" : ""} data-p="${caseState.page + 1}">›</button>`;
      pager = `<div class="pagination">${btns}</div>
        <div class="page-info">共 ${all.length} 条 · ${totalPages} 页 · 第 ${caseState.page} / ${totalPages} 页（每页 ${caseState.pageSize} 条）</div>`;
    }

    document.getElementById("case-container").innerHTML = `
      <div class="case-grid" style="grid-template-columns:repeat(${caseState.cols},1fr);">${cards}</div>
      ${pager}`;
    bindPager();
  }

  function bindPager() {
    document.querySelectorAll('.pagination button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        caseState.page = parseInt(btn.dataset.p, 10);
        renderCasePage();
      });
    });
  }

  // ---------------- 渲染页面 ----------------
  function renderNav(nav) {
    const menu = nav.items.map(m => {
      const sub = m.children ? `<div class="dropdown">${m.children.map(c =>
        `<a href="${esc(c.link)}">${esc(c.label)}</a>`).join("")}</div>` : "";
      return `<li><a href="${esc(m.link)}" class="${m.active ? "active" : ""}">${esc(m.label)}${m.children ? ' <span class="caret">▾</span>' : ""}</a>${sub}</li>`;
    }).join("");
    document.getElementById("site-header").innerHTML = `
      <div class="container nav">
        <a class="logo" href="index.html"><img src="${esc(nav.logo)}" alt="中惠文化"></a>
        <ul class="nav-menu">${menu}</ul>
        <div class="nav-lang"><a class="active" href="#">${esc(nav.langCurrent)}</a><span class="sep">|</span><a href="#">${esc(nav.langOther)}</a></div>
      </div>`;
  }

  function renderBlocks(blocks) {
    document.getElementById("page").innerHTML = blocks
      .filter(b => renderers[b.type])
      .map(b => renderers[b.type](b)).join("");
  }

  function renderFooter(f) {
    const info = f.info.map(i => `<p><span class="label">${esc(i.label)}</span>${esc(i.text)}</p>`).join("");
    const qr = f.qrcodes.map(q => `
      <div class="qr-item"><div class="qr">${esc(q.text).replace(/\n/g,"<br>")}</div><p>${esc(q.title)}</p></div>`).join("");
    document.getElementById("site-footer").innerHTML = `
      <div class="footer-grid">
        <div class="footer-brand"><img src="${esc(f.logo)}" alt="中惠文化"></div>
        <div class="footer-info">${info}</div>
        <div class="footer-qr"><h4>关注我们</h4><div class="qr-box">${qr}</div></div>
      </div>
      <div class="footer-copy">${esc(f.copyright)}</div>`;
  }

  renderNav(pageConfig.nav);
  renderBlocks(pageConfig.blocks);
  renderCasePage();
  renderFooter(pageConfig.footer);
  </script>
</body>
</html>
