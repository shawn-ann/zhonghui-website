<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>案例分享 — 中惠文化</title>
  <style>
    :root {
      --deep-blue: #8A0E4B;      /* 标题主色：深玫 */
      --bright-blue: #C2185B;    /* 链接/文字强调：深玫 */
      --light-blue: #FFF1F6;     /* 浅玫瑰底 */
      --gray-blue: #7C6B73;      /* 次要文字：暖玫灰 */
      --dark-text: #5A4A52;      /* 正文：暖玫灰 */
      --white: #FFFFFF;
      --border: #F0E3EA;
      --orange: #E60039;         /* 辅助强调色：品牌玫红 */
      --accent: #E60039;         /* 图标/主强调：品牌玫红 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
      color: var(--dark-text);
      line-height: 1.6;
      background: var(--white);
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ===== 顶部导航栏 ===== */
    header {
      background: var(--white);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 0 5px rgba(22,22,22,0.14);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 88px; }
    .logo img { display: block; height: 88px; width: auto; }
    .nav-right { display: flex; align-items: center; gap: 32px; }
    .nav-menu { display: flex; list-style: none; gap: 24px; align-items: center; }
    .nav-menu > li { position: relative; }
    .nav-menu > li > a {
      font-size: 16px; color: #E60039; font-weight: 600; padding: 6px 0;
      display: flex; align-items: center; gap: 4px;
    }
    .nav-menu > li > a.active { color: #E60039; }
    .nav-menu > li > a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
      height: 3px; border-radius: 2px; background: #E60039;
    }
    .nav-menu .caret { font-size: 10px; opacity: .8; }
    .nav-menu .dropdown {
      position: absolute; top: 100%; left: -12px; min-width: 172px;
      background: var(--white); border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 24px rgba(138,14,75,0.18); overflow: hidden;
      opacity: 0; visibility: hidden; transform: translateY(8px);
      transition: opacity .2s, transform .2s, visibility .2s;
      padding: 6px 0; z-index: 200;
    }
    .nav-menu > li:hover .dropdown,
    .nav-menu > li:focus-within .dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
    .nav-menu .dropdown a {
      display: block; padding: 11px 20px; font-size: 14px; color: #E60039;
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .nav-menu .dropdown a:hover { background: #E60039; color: #fff; }
    .nav-lang { font-size: 14px; color: var(--gray-blue); display: flex; gap: 6px; }
    .nav-lang .sep { color: var(--gray-blue); }
    .nav-lang a { color: var(--gray-blue); }
    .nav-lang a.active { color: #E60039; font-weight: 600; }

    /* ===== Banner（左文右图，与首页一致） ===== */
    .banner { position: relative; overflow: hidden; background: var(--white); padding: 0; }
    .banner-grid { display: flex; flex-direction: row; align-items: stretch; gap: 20px; padding: 60px 0 120px; }
    .banner-text { display: flex; flex-direction: column; justify-content: center; gap: 20px; flex: 1.25; padding-top: 20px; }
    .banner-text h1 { font-size: 48px; font-weight: 700; color: var(--deep-blue); line-height: 1.3; margin-bottom: 0; }
    .banner-text .sub { font-size: 24px; font-weight: 500; color: var(--gray-blue); }
    .banner-media { position: relative; flex: 1; min-height: 340px; }
    .banner-pattern { position: absolute; top: -45px; right: 10px; width: 80%; height: auto; display: block; z-index: 0; }
    .banner-photo { position: absolute; top: 0; left: 0; width: 88%; height: auto; display: block; z-index: 1; }

    /* ===== 区块通用 ===== */
    .section { padding: 56px 0; }
    .section-title { text-align: center; margin-bottom: 36px; }
    .section-title h2 { font-size: 30px; color: var(--deep-blue); font-weight: 700; }
    .title-on-image h2 { color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.45); }

    /* ===== 案例宫格（内容集合块） ===== */
    .case-grid { display: grid; gap: 18px; }
    .case-card {
      position: relative; border-radius: 8px; overflow: hidden; cursor: pointer;
      aspect-ratio: 1 / 1; display: block;
      background-size: cover; background-position: center;
      transition: transform .25s, box-shadow .25s;
    }
    .case-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(138,14,75,0.20); }
    .case-card .title {
      position: absolute; left: 0; right: 0; bottom: 0;
      padding: 10px 12px; font-size: 13px; font-weight: 600; color: #fff;
      background: rgba(138,14,75,0.55);   /* 半透明玫红遮罩 */
      backdrop-filter: blur(2px);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* ===== 分页 ===== */
    .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 40px; flex-wrap: wrap; }
    .pagination button {
      border: 1px solid #E60039; background: #fff; color: #E60039;
      min-width: 38px; height: 38px; padding: 0 10px; border-radius: 6px;
      cursor: pointer; font-size: 14px; font-weight: 600; transition: background .2s, color .2s;
    }
    .pagination button:hover { background: #FFF1F6; }
    .pagination button.active { background: #E60039; color: #fff; border-color: #E60039; }
    .pagination button:disabled { opacity: .45; cursor: not-allowed; }
    .page-info { text-align: center; color: #fff; font-size: 13px; margin-top: 14px; text-shadow: 0 1px 6px rgba(0,0,0,0.35); }

    /* ===== 页脚 ===== */
    footer { background: linear-gradient(124deg, #6E0B3E 0%, #A11254 50%, #C2185B 100%); color: #ffd7e6; }
    .footer-grid { max-width: 1200px; margin: 0 auto; padding: 130px 24px 116px; display: grid; grid-template-columns: 1.2fr 2fr 1fr; gap: 40px; }
    .footer-brand img { display: block; margin-bottom: 14px; height: 110px; width: auto; }
    .footer-brand .zh { font-size: 22px; font-weight: 700; color: #fff; }
    .footer-brand .en { font-size: 12px; letter-spacing: 2px; color: #f0a9c6; margin-top: 4px; }
    .footer-info p { font-size: 14px; margin-bottom: 12px; color: #ffd7e6; }
    .footer-info .label { color: #f0a9c6; margin-right: 8px; }
    .footer-copy { border-top: 1px solid rgba(255,255,255,.18); padding: 20px 24px; text-align: center; font-size: 13px; color: #f0a9c6; }
    .footer-qr { text-align: center; }
    .footer-qr h4 { color: #fff; font-size: 16px; margin-bottom: 16px; }
    .qr-box { display: flex; gap: 16px; justify-content: center; }
    .qr-item .qr { width: 92px; height: 92px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--deep-blue); font-size: 11px; text-align: center; padding: 6px; margin-bottom: 8px; }
    .qr-item p { font-size: 13px; color: #ffd7e6; }
    .foot-contact { display: block; margin-top: 18px; text-align: left; color: #ffd7e6; font-size: 14px; text-decoration: none; }
    .foot-contact:hover { color: #ffffff; }

    @media (max-width: 1000px) {
      .case-grid { grid-template-columns: repeat(4, 1fr) !important; }
    }
    @media (max-width: 900px) {
      .banner-grid { flex-direction: column; padding: 40px 0 60px; }
      .banner-text { justify-content: flex-start; padding-top: 0; }
      .banner-media { min-height: 0; }
      .banner-photo { position: static; width: 100%; margin-top: 24px; }
      .banner-pattern { display: none; }
    }
    @media (max-width: 600px) {
      .case-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
  </style>
</head>
<body>

  <header id="site-header"></header>
  <main id="page"></main>
  <footer id="site-footer"></footer>

  <script>
  /* =========================================================
     CMS 配置化内容模型 —— 案例分享列表页
     pageConfig 模拟后端返回值。
     列表页由「内容集合块 content-collection」渲染：
       source = cases 集合；grid 3排8列；每格=背景大图+半透明标题；分页。
     ========================================================= */

  // 案例集合（图文内容，模拟后端）
  const collections = {
    cases: [
      { title: "小曹同学的赴美之旅", cover: "url('img/memory-4.jpg')", link: "case-detail.html?id=xiaocao" },
      { title: "小丁同学的逆袭故事", cover: "url('img/prog-iccp.jpg')", link: "case-detail.html?id=xiaoding" },
      { title: "SWT 2025 年 0 拒签记录", cover: "url('img/memory-6.jpg')", link: "#" },
      { title: "德州营地体验感悟", cover: "url('img/prog-au-pair-eu.jpg')", link: "#" },
      { title: "我的第一次赴美带薪实习", cover: "url('img/prog-swt.jpg')", link: "#" },
      { title: "ITP 会计岗位面试心得", cover: "url('img/memory-8.png')", link: "#" },
      { title: "营地里的马术时光", cover: "url('img/prog-itp.jpg')", link: "#" },
      { title: "互惠生的美国家庭生活", cover: "url('img/memory-5.jpg')", link: "#" },
      { title: "在四季酒店实习的每一天", cover: "url('img/prog-au-pair-eu.jpg')", link: "#" },
      { title: "海边救生员的夏天", cover: "url('img/memory-1.png')", link: "#" },
      { title: "里斯本 WYSTC 大会见闻", cover: "url('img/prog-uk-study.jpg')", link: "#" },
      { title: "从英语小白到一签过签", cover: "url('img/prog-au-pair-eu.jpg')", link: "#" },
      { title: "游乐园设备操作员手记", cover: "url('img/prog-swt.jpg')", link: "#" },
      { title: "旧金山自由行 30 天", cover: "url('img/memory-7.jpg')", link: "#" },
      { title: "学员 Offer 展示合集", cover: "url('img/memory-7.jpg')", link: "#" },
      { title: "我的美国室友们", cover: "url('img/prog-swt.jpg')", link: "#" },
      { title: "夏令营辅导员的日常", cover: "url('img/prog-us-study.jpg')", link: "#" },
      { title: "面试培训复盘笔记", cover: "url('img/prog-swt.jpg')", link: "#" },
      { title: "第一次见雇主的那一刻", cover: "url('img/memory-8.png')", link: "#" },
      { title: "厨房帮工的有趣经历", cover: "url('img/memory-7.jpg')", link: "#" },
      { title: "拉斯维加斯打工周记", cover: "url('img/prog-au-pair-eu.jpg')", link: "#" },
      { title: "我的寄宿家庭爸爸妈妈", cover: "url('img/prog-itp.jpg')", link: "#" },
      { title: "华盛顿特区环球记", cover: "url('img/prog-us-study.jpg')", link: "#" },
      { title: "SWT 全流程签证指南分享", cover: "url('img/prog-au-pair-eu.jpg')", link: "#" },
      { title: "2026 救生员北京站培训", cover: "url('img/memory-6.jpg')", link: "#" },
      { title: "第一次超员上夜班", cover: "url('img/prog-au-pair-eu.jpg')", link: "#" }
      // 共 26 条，用于演示分页（每页 24 条 → 2 页）
    ]
  };

  const pageConfig = {
    title: "案例分享",
    nav: {
      logo: "img/pink_logo_with_text_1.jpg",
      langCurrent: "中文", langOther: "EN",
      items: [
        { label: "首页", link: "index.html" },
        { label: "关于中惠", link: "about.html" },
        { label: "互惠生", link: "#" },
        { label: "赴美J1交流项目", link: "project-swt.html", children: [
            { label: "SWT 赴美带薪实习", link: "project-swt.html" },
            { label: "ITP 赴美专业实习", link: "#" },
            { label: "ICCP 赴美营地辅导员", link: "#" } ] },
        { label: "海外留学", link: "#" },
        { label: "案例分享", link: "cases.html", active: true },
        { label: "联系我们", link: "contact.html" }
      ]
    },
    footer: {
      logo: "img/footLogo.png",
      info: [
        { label: "📍 地址：", text: "北京东城区绿景馨园东区12号楼" },
        { label: "📞 电话：", text: "010-64159286" },
        { label: "✉ 邮箱：", text: "info@zhonghui.com" },
        { label: "🌐 中文官网：", text: "www.chinaaupairs.com" },
        { label: "🌐 英文官网：", text: "www.aupaircn.com" }
      ],
      qrcodes: [
        { title: "公众号", text: "公众号\n二维码" },
        { title: "咨询微信", text: "咨询微信\n二维码" },
        { title: "视频号", text: "视频号\n二维码" }
      ],
      copyright: "Copyright © 2026 中惠文化　·　京ICP备XXXXXXXX号"
    },
    blocks: [
      // ① Banner（左文右图，与首页一致）
      { type: "banner",
        data: { headline: "每一段旅程，都值得被记录", sub: "来自全国学员的真实案例与经验分享" },
        options: { image: "img/about-hero.jpg", pattern: "img/pattern-box-5.svg" } },
      // ② 内容集合块：案例宫格（source=cases, grid, 3排8列=每页24条）
      { type: "content-collection",
        data: {
          title: "案例分享",
          source: "cases",
          layout: "grid",      // grid | list
          cols: 4, rows: 3,    // 每页 4列 × 3排 = 12 条
          pageSize: 12
        },
        options: { bg: "img/yinji-bg.jpg" } }
    ]
  };

  // ---------------- 渲染器 ----------------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const renderers = {
    banner(b) {
      const c = b.data, img = b.options.image || "", pattern = b.options.pattern || "";
      const inner = `<div class="container banner-grid">
        <div class="banner-text">
          ${c.headline ? `<h1>${esc(c.headline)}</h1>` : ""}
          ${c.sub ? `<p class="sub">${esc(c.sub)}</p>` : ""}
        </div>
        ${img ? `<div class="banner-media">
          ${pattern ? `<img class="banner-pattern" src="${esc(pattern)}" alt="">` : ""}
          <img class="banner-photo" src="${esc(img)}" alt="${esc(c.headline || "中惠文化")}">
        </div>` : ""}
      </div>`;
      return `<section class="banner">${inner}</section>`;
    },
    "content-collection"(b) {
      const bg = b.options.bg;
      const secStyle = bg ? `style="background-image:url('${esc(bg)}');background-size:cover;background-position:center;"` : "";
      return `<section class="section" ${secStyle}><div class="container">
        <div class="section-title${bg ? " title-on-image" : ""}"><h2>${esc(b.data.title)}</h2></div>
        <div id="case-container"></div>
      </div></section>`;
    }
  };

  // ---------------- 内容集合块：数据 + 分页 + 渲染 ----------------
  let caseState = { page: 1, pageSize: 24, cols: 8, all: [] };

  function renderCasePage() {
    const cfg = pageConfig.blocks.find(x => x.type === "content-collection").data;
    const all = collections[cfg.source] || [];
    caseState.all = all;
    caseState.pageSize = cfg.pageSize || 24;
    caseState.cols = cfg.cols || 8;
    const totalPages = Math.max(1, Math.ceil(all.length / caseState.pageSize));
    if (caseState.page > totalPages) caseState.page = totalPages;
    const start = (caseState.page - 1) * caseState.pageSize;
    const pageItems = all.slice(start, start + caseState.pageSize);

    const cards = pageItems.map(c => `
      <a class="case-card" href="${esc(c.link || "#")}" style="background-image:${esc(c.cover)};">
        <span class="title">${esc(c.title)}</span>
      </a>`).join("");

    let pager = "";
    if (totalPages > 1) {
      let btns = `<button ${caseState.page === 1 ? "disabled" : ""} data-p="${caseState.page - 1}">‹</button>`;
      for (let i = 1; i <= totalPages; i++) {
        btns += `<button class="${i === caseState.page ? "active" : ""}" data-p="${i}">${i}</button>`;
      }
      btns += `<button ${caseState.page === totalPages ? "disabled" : ""} data-p="${caseState.page + 1}">›</button>`;
      pager = `<div class="pagination">${btns}</div>
        <div class="page-info">共 ${all.length} 条 · ${totalPages} 页 · 第 ${caseState.page} / ${totalPages} 页（每页 ${caseState.pageSize} 条）</div>`;
    }

    document.getElementById("case-container").innerHTML = `
      <div class="case-grid" style="grid-template-columns:repeat(${caseState.cols},1fr);">${cards}</div>
      ${pager}`;
    bindPager();
  }

  function bindPager() {
    document.querySelectorAll('.pagination button').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.disabled) return;
        caseState.page = parseInt(btn.dataset.p, 10);
        renderCasePage();
      });
    });
  }

  // ---------------- 渲染页面 ----------------
  function renderNav(nav) {
    const menu = nav.items.map(m => {
      const sub = m.children ? `<div class="dropdown">${m.children.map(c =>
        `<a href="${esc(c.link)}">${esc(c.label)}</a>`).join("")}</div>` : "";
      return `<li><a href="${esc(m.link)}" class="${m.active ? "active" : ""}">${esc(m.label)}${m.children ? ' <span class="caret">▾</span>' : ""}</a>${sub}</li>`;
    }).join("");
    document.getElementById("site-header").innerHTML = `
      <div class="container nav">
        <a class="logo" href="index.html"><img src="${esc(nav.logo)}" alt="中惠文化"></a>
        <div class="nav-right">
          <ul class="nav-menu">${menu}</ul>
          <div class="nav-lang"><a class="active" href="#">${esc(nav.langCurrent)}</a><span class="sep">|</span><a href="#">${esc(nav.langOther)}</a></div>
        </div>
      </div>`;
  }

  function renderBlocks(blocks) {
    document.getElementById("page").innerHTML = blocks
      .filter(b => renderers[b.type])
      .map(b => renderers[b.type](b)).join("");
  }

  function renderFooter(f) {
    const info = f.info.map(i => `<p><span class="label">${esc(i.label)}</span>${esc(i.text)}</p>`).join("");
    const qr = f.qrcodes.map(q => `
      <div class="qr-item"><div class="qr">${esc(q.text).replace(/\n/g,"<br>")}</div></div>`).join("");
    document.getElementById("site-footer").innerHTML = `
      <div class="footer-grid">
        <div class="footer-brand"><img src="${esc(f.logo)}" alt="中惠文化"></div>
        <div class="footer-info">${info}</div>
        <div class="footer-qr"><div class="qr-box">${qr}</div><a class="foot-contact" href="contact.html">联系我们</a></div>
      </div>
      <div class="footer-copy">${esc(f.copyright)}</div>`;
  }

  renderNav(pageConfig.nav);
  renderBlocks(pageConfig.blocks);
  renderCasePage();
  renderFooter(pageConfig.footer);
  </script>
</body>
</html>
