<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>赴美营地辅导员 — 中惠文化</title>
  <style>
    :root {
      --deep-blue: #8A0E4B;
      --bright-blue: #C2185B;
      --light-blue: #FFF1F6;
      --gray-blue: #7C6B73;
      --dark-text: #5A4A52;
      --white: #FFFFFF;
      --border: #F0E3EA;
      --orange: #E60039;
      --accent: #E60039;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
      color: var(--dark-text);
      line-height: 1.6;
      background: var(--white);
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ===== 顶部导航栏 ===== */
    header {
      background: var(--white);
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 0 5px rgba(22,22,22,0.14);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 88px; }
    .logo img { display: block; height: 88px; width: auto; }
    .nav-right { display: flex; align-items: center; gap: 32px; }
    .nav-menu { display: flex; list-style: none; gap: 24px; align-items: center; }
    .nav-menu > li { position: relative; }
    .nav-menu > li > a {
      font-size: 16px; color: #E60039; font-weight: 600; padding: 6px 0;
      display: flex; align-items: center; gap: 4px;
    }
    .nav-menu > li > a.active { color: #E60039; }
    .nav-menu > li > a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
      height: 3px; border-radius: 2px; background: #E60039;
    }
    .nav-menu .caret { font-size: 10px; opacity: .8; }
    .nav-menu .dropdown {
      position: absolute; top: 100%; left: -12px; min-width: 190px;
      background: var(--white); border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 24px rgba(138,14,75,0.18); overflow: hidden;
      opacity: 0; visibility: hidden; transform: translateY(8px);
      transition: opacity .2s, transform .2s, visibility .2s;
      padding: 6px 0; z-index: 200;
    }
    .nav-menu > li:hover .dropdown,
    .nav-menu > li:focus-within .dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
    .nav-menu .dropdown a {
      display: block; padding: 11px 20px; font-size: 14px; color: #E60039;
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .nav-menu .dropdown a:hover { background: #E60039; color: #fff; }
    .nav-lang { font-size: 14px; color: var(--gray-blue); display: flex; gap: 6px; }
    .nav-lang .sep { color: var(--gray-blue); }
    .nav-lang a { color: var(--gray-blue); }
    .nav-lang a.active { color: #E60039; font-weight: 600; }

    /* ===== Banner（左文右图，与首页一致） ===== */
    .banner { position: relative; overflow: hidden; background: var(--white); padding: 0; }
    .banner-grid { display: flex; flex-direction: row; align-items: stretch; gap: 20px; padding: 60px 0 120px; }
    .banner-text { display: flex; flex-direction: column; justify-content: center; gap: 20px; flex: 1.25; padding-top: 20px; }
    .banner-text h1 { font-size: 48px; font-weight: 700; color: var(--deep-blue); line-height: 1.3; margin-bottom: 0; }
    .banner-text .sub { font-size: 24px; font-weight: 500; color: var(--gray-blue); }
    .banner-media { position: relative; flex: 1; min-height: 340px; }
    .banner-pattern { position: absolute; top: -45px; right: 10px; width: 80%; height: auto; display: block; z-index: 0; }
    .banner-photo { position: absolute; top: 0; left: 0; width: 88%; height: auto; display: block; z-index: 1; }

    /* ===== 正文：分节（中标题 + 列表 + 问答 + 步骤），白底 ===== */
    .section { padding: 72px 0; background: #fff; }
    .article { max-width: 900px; margin: 0 auto; }
    .article-title { font-size: 30px; color: var(--deep-blue); font-weight: 700; text-align: center; margin-bottom: 32px; }
    .sec-p { font-size: 15px; color: var(--dark-text); line-height: 1.9; margin-bottom: 10px; }
    .sec-list { list-style: none; margin: 0 0 8px; }
    .sec-list li { position: relative; padding-left: 22px; margin-bottom: 9px; font-size: 15px; color: var(--dark-text); line-height: 1.8; }
    .sec-list li::before { content: ""; position: absolute; left: 2px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .qa { background: #FFF7FA; border-radius: 10px; padding: 16px 20px; margin-bottom: 12px; }
    .qa .q { font-weight: 700; color: var(--deep-blue); font-size: 15px; margin-bottom: 6px; }
    .qa .a { font-size: 15px; color: var(--dark-text); line-height: 1.85; }
    .steps .step-item { display: flex; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--border); }
    .steps .step-item:last-child { border-bottom: none; }
    .steps .n { flex: 0 0 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
    .steps .t { font-size: 15px; color: var(--dark-text); line-height: 1.8; }
    .steps-row { display: flex; gap: 48px; align-items: flex-start; }
    .steps-media { flex: 0 0 46%; }
    .steps-media img { width: 100%; display: block; border-radius: 12px; box-shadow: 0 12px 30px rgba(138,14,75,0.16); }
    .steps-col { flex: 1; }

    /* ===== 标题行（浅灰底图） ===== */
    .title-strip { background: url('img/title-bg.jpg') center/cover no-repeat; padding: 20px 0; }
    .strip-title { text-align: center; font-size: 30px; font-weight: 700; color: var(--deep-blue); }
    .strip-en { text-align: center; font-size: 14px; color: #9a9a9a; letter-spacing: 1px; margin-top: 8px; }

    /* ===== 项目介绍：居中的色块（四周留白，左文右图） ===== */
    .intro-band-wrap { padding: 48px 0; }
    .intro-band { background: linear-gradient(124deg, #6E0B3E 0%, #A11254 50%, #C2185B 100%); padding: 56px 48px; box-shadow: 0 16px 40px rgba(138,14,75,0.18); }
    .intro-band-inner { display: flex; align-items: center; gap: 44px; }
    .intro-text { flex: 0 0 40%; }
    .intro-text h3 { font-size: 28px; font-weight: 700; color: #fff; margin-bottom: 16px; }
    .intro-text p { font-size: 15px; line-height: 1.95; color: rgba(255,255,255,.94); margin-bottom: 12px; }
    .intro-media { flex: 1; }
    .intro-media img { width: 100%; display: block; border-radius: 12px; box-shadow: 0 14px 34px rgba(0,0,0,0.28); }

    /* ===== 工作内容：左右文字 + 中间圆形照片簇 ===== */
    .wc-grid { display: grid; grid-template-columns: 1fr 340px 1fr; gap: 40px; align-items: center; }
    .wc-col { display: flex; flex-direction: column; gap: 60px; }
    .wc-col-right { padding-top: 90px; }
    .wc-item { position: relative; padding-left: 22px; font-size: 15px; color: var(--dark-text); line-height: 1.95; }
    .wc-item::before { content: ""; position: absolute; left: 2px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .wc-center { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    .wc-center img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 5px solid #fff; box-shadow: 0 10px 24px rgba(138,14,75,0.22); display: block; }
    .wc-center img:nth-child(1) { margin-right: 72px; }
    .wc-center img:nth-child(2) { margin-left: 72px; }
    .wc-center img:nth-child(3) { margin-right: 72px; }
    .wc-note { max-width: 860px; margin: 44px auto 0; text-align: center; font-size: 15px; color: var(--gray-blue); line-height: 1.95; }

    /* ===== 页脚 ===== */
    footer { background: linear-gradient(124deg, rgba(110,11,62,.62) 0%, rgba(161,18,84,.62) 50%, rgba(194,24,91,.62) 100%), url('img/footbg.jpg') center/cover no-repeat; color: #ffd7e6; }
    .footer-grid { max-width: 1200px; margin: 0 auto; padding: 130px 24px 116px; display: grid; grid-template-columns: 1.2fr 2fr 1fr; gap: 40px; }
    .footer-brand img { display: block; margin-bottom: 14px; height: 110px; width: auto; }
    .footer-brand .en { font-size: 12px; letter-spacing: 2px; color: #f0a9c6; margin-top: 4px; }
    .footer-info p { font-size: 14px; margin-bottom: 12px; color: #ffd7e6; }
    .footer-info .label { color: #f0a9c6; margin-right: 8px; }
    .footer-qr { text-align: center; }
    .qr-box { display: flex; gap: 16px; justify-content: center; }
    .qr-item .qr { width: 92px; height: 92px; background: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: var(--deep-blue); font-size: 11px; text-align: center; padding: 6px; margin-bottom: 8px; }
    .foot-contact { display: block; margin-top: 18px; text-align: left; color: #ffd7e6; font-size: 14px; text-decoration: none; }
    .foot-contact:hover { color: #ffffff; }

    @media (max-width: 900px) {
      .footer-grid { grid-template-columns: 1fr; }
      .banner-grid { flex-direction: column; padding: 40px 0 60px; }
      .banner-text { justify-content: flex-start; padding-top: 0; }
      .banner-media { min-height: 0; }
      .banner-photo { position: static; width: 100%; margin-top: 24px; }
      .banner-pattern { display: none; }
    }
  </style>
</head>
<body>

  <main id="page"></main>

            "在获得收入、获得宝贵的海外工作经验与培训经历的同时，还为语言能力及综合素质的提升创造了机会。工作结束后，还可畅游美国整整一个月！" ],

      // ④ 正文：分节（白底）
      { type: "sections",

              { q: "项目期间包食宿吗？", a: "是的，营地期间提供免费住宿及三餐。" },
              { q: "需要什么样的经验？", a: "喜欢与孩子相处、有照顾儿童的经验更佳；具备良好的英语沟通能力即可报名。" },
              { q: "一般工作在什么时间？", a: "每年 6 月上旬开始、8 月中下旬结束，工作时长约 63 天，每周休息一天。" },
              { q: "项目结束后能旅游吗？", a: "项目结束后有 30 天的合法停留期，可在美国境内自由旅行。" } ] },

            { cn: "报名流程", en: "The Program Process", img: "img/prog-iccp.jpg", steps: [
              "确认报名", "填写在线表格", "中惠面试并填写面试报告", "中惠审核后提交",
              "项目举办方决定是否接受申请", "匹配", "确认匹配", "匹配确认函",
              "在线培训", "签证申请", "抵达" ] }

        options: {} }
    ]
  };

  // ---------------- 渲染器 ----------------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const renderers = {
    banner(b) {
      const c = b.data, img = b.options.image || "", pattern = b.options.pattern || "";
      const inner = `<div class="container banner-grid">
        <div class="banner-text">
          ${c.headline ? `<h1>${esc(c.headline)}</h1>` : ""}
          ${c.sub ? `<p class="sub">${esc(c.sub)}</p>` : ""}
        </div>
        ${img ? `<div class="banner-media">
          ${pattern ? `<img class="banner-pattern" src="${esc(pattern)}" alt="">` : ""}
          <img class="banner-photo" src="${esc(img)}" alt="${esc(c.headline || "中惠文化")}">
        </div>` : ""}
      </div>`;
      return `<section class="banner">${inner}</section>`;
    },
    "sections"(b) {
      const d = b.data;
      return (d.sections || []).map(s => {
        const strip = `<section class="title-strip"><div class="container"><h2 class="strip-title">${esc(s.cn)}</h2>${s.en ? `<div class="strip-en">${esc(s.en)}</div>` : ""}</div></section>`;
        let body = "";
        if (s.paras) body += s.paras.map(p => `<p class="sec-p">${esc(p)}</p>`).join("");
        if (s.list) body += `<ul class="sec-list">${s.list.map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;
        if (s.qa) body += s.qa.map(x => `<div class="qa"><div class="q">Q：${esc(x.q)}</div><div class="a">A：${esc(x.a)}</div></div>`).join("");
        if (s.steps) {
          const stepsHtml = `<div class="steps">${s.steps.map((t, i) => `<div class="step-item"><span class="n">${i + 1}</span><span class="t">${esc(t)}</span></div>`).join("")}</div>`;
          body += s.img ? `<div class="steps-row"><div class="steps-media"><img src="${esc(s.img)}" alt=""></div><div class="steps-col">${stepsHtml}</div></div>` : stepsHtml;
        }
        return strip + `<section class="section"><div class="container article">${body}</div></section>`;
      }).join("");
    },
    "intro-band"(b) {
      const d = b.data;
      return `<section class="title-strip"><div class="container">
        <h2 class="strip-title">${esc(d.title)}</h2>
        ${d.en ? `<div class="strip-en">${esc(d.en)}</div>` : ""}
      </div></section>
      <section class="intro-band-wrap"><div class="container"><div class="intro-band"><div class="intro-band-inner">
        <div class="intro-text">
          <h3>${esc(d.heading)}</h3>
          ${(d.paras || []).map(p => `<p>${esc(p)}</p>`).join("")}
        </div>
        <div class="intro-media"><img src="${esc(d.img)}" alt=""></div>
      </div></div></div></section>`;
    },
    "work-content"(b) {
      const d = b.data;
      const item = (t) => `<div class="wc-item">${esc(t)}</div>`;
      const photos = (d.photos || []).map(s => `<img src="${esc(s)}" alt="">`).join("");
      return `<section class="title-strip"><div class="container"><h2 class="strip-title">${esc(d.title)}</h2>${d.en ? `<div class="strip-en">${esc(d.en)}</div>` : ""}</div></section>
      <section class="section"><div class="container">
        <div class="wc-grid">
          <div class="wc-col">${(d.left || []).map(item).join("")}</div>
          <div class="wc-center">${photos}</div>
          <div class="wc-col wc-col-right">${(d.right || []).map(item).join("")}</div>
        </div>
        ${d.note ? `<p class="wc-note">${esc(d.note)}</p>` : ""}
      </div></section>`;
    }
  };

  // ---------------- 渲染页面 ----------------
  function renderNav(nav) {
    const menu = nav.items.map(m => {
      const sub = m.children ? `<div class="dropdown">${m.children.map(c =>
        `<a href="${esc(c.link)}">${esc(c.label)}</a>`).join("")}</div>` : "";
      return `<li><a href="${esc(m.link)}" class="${m.active ? "active" : ""}">${esc(m.label)}${m.children ? ' <span class="caret">▾</span>' : ""}</a>${sub}</li>`;
    }).join("");
    document.getElementById("site-header").innerHTML = `
      <div class="container nav">
        <a class="logo" href="index.html"><img src="${esc(nav.logo)}" alt="中惠文化"></a>
        <div class="nav-right">
          <ul class="nav-menu">${menu}</ul>
          <div class="nav-lang"><a class="active" href="#">${esc(nav.langCurrent)}</a><span class="sep">|</span><a href="#">${esc(nav.langOther)}</a></div>
        </div>
      </div>`;
  }

  function renderBlocks(blocks) {
    document.getElementById("page").innerHTML = blocks
      .filter(b => renderers[b.type])
      .map(b => renderers[b.type](b)).join("");
  }

  function renderFooter(f) {
    const info = f.info.map(i => `<p><span class="label">${esc(i.label)}</span>${esc(i.text)}</p>`).join("");
    const qr = f.qrcodes.map(q => `
      <div class="qr-item"><div class="qr">${esc(q.text).replace(/\n/g,"<br>")}</div></div>`).join("");
    document.getElementById("site-footer").innerHTML = `
      <div class="footer-grid">
        <div class="footer-brand"><img src="${esc(f.logo)}" alt="中惠文化"></div>
        <div class="footer-info">${info}</div>
        <div class="footer-qr"><div class="qr-box">${qr}</div><a class="foot-contact" href="contact.html">联系我们</a></div>
      </div>`;
  }

  renderNav(pageConfig.nav);
  renderBlocks(pageConfig.blocks);
  renderFooter(pageConfig.footer);
  </script>
</body>
</html>
