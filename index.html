<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中惠文化 — 你的国际文化交流可靠伙伴</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css">
  <style>
    :root {
      --deep-blue: #8A0E4B;      /* 标题主色：深玫（A 方案·玫红主调） */
      --bright-blue: #FF007A;    /* 强调色：品牌玫红 */
      --light-blue: #FFF1F6;     /* 浅玫瑰底 */
      --pale-blue: #F5EBD0;      /* 米金 */
      --gray-blue: #6B6570;      /* 次要灰文字 */
      --dark-text: #5A5560;      /* 正文 */
      --white: #FFFFFF;
      --border: #F0E3EA;
      --orange: #FF007A;         /* 辅助强调色 */
      --accent: #FF007A;         /* 图标/强调色 */
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
      color: var(--dark-text);
      line-height: 1.6;
      background: var(--white);
    }
    a { text-decoration: none; color: inherit; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* ===== 顶部导航栏 ===== */
    header {
      background: var(--white);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 0 5px rgba(22,22,22,0.14);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .nav-right { display: flex; align-items: center; gap: 32px; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo img { display: block; height: 44px; width: auto; }
    .nav-menu { display: flex; list-style: none; gap: 24px; align-items: center; }
    .nav-menu a { font-size: 15px; color: #FF007A; font-weight: 500; position: relative; padding: 6px 0; transition: color .2s; }
    .nav-menu a:hover { color: #C2185B; }
    .nav-menu a.active { color: #C2185B; }
    .nav-menu li { position: relative; }
    .nav-menu li.active > a::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -4px;
      height: 3px; border-radius: 2px; background: #FF007A;
    }
    .nav-menu .caret { font-size: 10px; opacity: .8; }
    .nav-menu .dropdown {
      position: absolute; top: 100%; left: -12px; min-width: 168px;
      background: var(--white); border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 24px rgba(26,41,88,0.18); overflow: hidden;
      opacity: 0; visibility: hidden; transform: translateY(8px);
      transition: opacity .2s, transform .2s, visibility .2s;
      padding: 6px 0; z-index: 200;
    }
    .nav-menu li:hover .dropdown { opacity: 1; visibility: visible; transform: translateY(0); }
    .nav-menu .dropdown a {
      display: block; padding: 11px 20px; font-size: 14px; color: #C2185B;
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .nav-menu .dropdown a:hover { background: #FF007A; color: #ffffff; }
    .nav-lang { font-size: 14px; color: var(--gray-blue); display: flex; gap: 6px; }
    .nav-lang .sep { color: var(--gray-blue); }
    .nav-lang a { color: var(--gray-blue); }
    .nav-lang a:hover { color: #FF007A; }
    .nav-lang a.active { color: #C2185B; font-weight: 600; }

    /* ===== 区块通用 ===== */
    .section { padding: 72px 0; }
    .section-alt { background: var(--light-blue); }
    .section-title { text-align: center; margin-bottom: 44px; }
    .section-title h2 { font-size: 32px; color: var(--deep-blue); font-weight: 700; }

    /* ===== Banner 块 ===== */
    .banner { position: relative; overflow: hidden; background: var(--white); padding: 0; }
    .banner--split .banner-grid { display: flex; flex-direction: row; align-items: stretch; gap: 20px; padding: 60px 0 120px; }
    .banner--split .banner-text { display: flex; flex-direction: column; justify-content: center; gap: 20px; flex: 1.25; padding-top: 20px; }
    .banner--split .banner-text h1 { font-size: 48px; font-weight: 700; color: var(--deep-blue); line-height: 1.3; margin-bottom: 0; }
    .banner--split .banner-text .sub { font-size: 24px; font-weight: 500; color: var(--gray-blue); }
    .banner--split .banner-media { position: relative; flex: 1; min-height: 340px; }
    .banner--split .banner-pattern { position: absolute; top: -45px; right: 10px; width: 80%; height: auto; display: block; z-index: 0; }
    .banner--split .banner-photo { position: absolute; top: 0; left: 0; width: 88%; height: auto; display: block; z-index: 1; border-radius: 0; }
    .banner--centered { min-height: 420px; display: flex; align-items: center; justify-content: center; background-size: cover; background-position: center; }
    .banner--centered .cover { position: relative; z-index: 1; text-align: center; color: #fff; padding: 0 24px; }
    .banner--centered .cover h1 { font-size: 52px; font-weight: 700; letter-spacing: 4px; text-shadow: 0 2px 16px rgba(0,0,0,0.45); }
    .banner--centered .cover .sub { font-size: 40px; font-weight: 500; margin-top: 12px; letter-spacing: 2px; }

    /* ===== 卡片网格块（可选列数） ===== */
    .prog-grid { display: grid; gap: 28px; }
    .prog-card {
      background: var(--white); border-radius: 12px; padding: 32px 24px;
      text-align: center; border: 1px solid var(--border);
      transition: transform .25s, box-shadow .25s;
    }
    .prog-card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(26,41,88,0.14); }
    .prog-card .icon {
      width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 20px;
      background: var(--light-blue); color: var(--deep-blue);
      display: flex; align-items: center; justify-content: center; font-size: 28px;
    }
    .prog-card h3 { font-size: 19px; color: var(--deep-blue); line-height: 1.3; }
    .prog-card .sub { font-size: 13px; color: var(--gray-blue); margin: 10px auto 18px; }
    .prog-card .more {
      display: inline-block; color: var(--bright-blue); font-weight: 600; font-size: 14px;
      border-bottom: 2px solid transparent; transition: border-color .2s;
    }
    .prog-card .more:hover { border-color: var(--bright-blue); }

    /* ===== 故事列表块（从集合自动取前 N 条，左右分栏） ===== */
    .story-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
    .story-card {
      background: var(--white); border-radius: 12px; overflow: hidden;
      border: 1px solid var(--border); transition: transform .25s, box-shadow .25s; cursor: pointer;
    }
    .story-card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(26,41,88,0.14); }
    .story-card .thumb { height: 300px; background-size: cover; background-repeat: no-repeat; background-position: center; position: relative; }
    .story-card .tag {
      position: absolute; top: 14px; left: 14px; background: var(--orange);
      color: #fff; font-size: 12px; padding: 3px 12px; border-radius: 20px;
    }
    .story-card .body { padding: 24px; }
    .story-card h3 { font-size: 19px; color: var(--deep-blue); }
    .story-card p { font-size: 14px; color: var(--gray-blue); margin: 12px 0 16px; }
    .story-card .read { color: var(--bright-blue); font-weight: 600; font-size: 14px; }
    .story-card .read::after { content: " →"; }

    /* ===== 项目一览矩阵块（3×3 卡片） ===== */
    .proj-grid { display: grid; gap: 28px; }
    .proj-card {
      position: relative; border-radius: 12px; overflow: hidden;
      background: var(--white); border: 1px solid var(--border);
      box-shadow: 0 6px 18px rgba(26,41,88,0.08);
      transition: transform .25s, box-shadow .25s;
    }
    .proj-card:hover { transform: translateY(-6px); box-shadow: 0 14px 30px rgba(26,41,88,0.16); }
    .proj-card .ph { aspect-ratio: 4 / 3; overflow: hidden; }
    .proj-card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .proj-body { padding: 20px 24px 24px; }
    .proj-body h3 { font-size: 20px; color: var(--deep-blue); font-weight: 600; }
    .proj-body p { font-size: 14px; color: var(--gray-blue); margin-top: 8px; }
    .title-on-image h2 { color: #ffffff; text-shadow: 0 2px 12px rgba(0,0,0,0.55); }

    /* ===== 优势图标网格块（图标+标题+描述） ===== */
    .adv-grid { display: grid; gap: 28px; }
    .adv-card {
      text-align: center; padding: 32px 20px;
      background: var(--white); border: 1px solid var(--border); border-radius: 12px;
      transition: transform .25s, box-shadow .25s;
    }
    .adv-card:hover { transform: translateY(-6px); box-shadow: 0 12px 28px rgba(26,41,88,0.14); }
    .adv-card .icon {
      width: 104px; height: 104px; border-radius: 50%; margin: 0 auto 20px;
      background: #fff; border: 2px solid currentColor; color: var(--accent);
      display: flex; align-items: center; justify-content: center;
    }
    .adv-card .icon svg { width: 60px; height: 60px; display: block; }
    .adv-card h3 { font-size: 19px; color: var(--deep-blue); font-weight: 600; }
    .adv-card p { font-size: 14px; color: var(--gray-blue); margin-top: 10px; line-height: 1.8; }

    /* ===== 中惠印记：Swiper 3D 封面流（参照 chinaaupairs.com） ===== */
    .memory-slider { position: relative; overflow: hidden; background-color: #3A0A22; }
    .memory-slider .container { position: relative; z-index: 1; }
    .memory-slider .swiper { padding: 24px 0 44px; position: relative; }
    .memory-slider .slide-inner { position: relative; transition: transform .45s ease; }
    .memory-slider .swiper-slide img {
      width: 100%; height: 380px; object-fit: cover; border-radius: 14px; display: block;
      box-shadow: 0 12px 28px rgba(0,0,0,0.35); position: relative; z-index: 1;
    }
    .memory-slider .swiper-slide-prev .slide-inner::after,
    .memory-slider .swiper-slide-next .slide-inner::after {
      content: ""; position: absolute; inset: 0; z-index: 2;
      background: rgba(15,25,50,0.42); border-radius: 14px; pointer-events: none;
    }
    .memory-slider .swiper-slide-active { z-index: 5; }
    .memory-slider .swiper-slide-active .slide-inner { transform: scale(1.15); }
    .memory-slider .swiper-slide-prev .slide-inner { transform: translateX(34px) scale(0.85); }
    .memory-slider .swiper-slide-next .slide-inner { transform: translateX(-34px) scale(0.85); }
    .memory-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 70px; height: 70px; border-radius: 50%;
      background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center;
      cursor: pointer; z-index: 10; transition: background .2s; border: none;
    }
    .memory-arrow:hover { background: #000000; }
    .memory-arrow svg { width: 22px; height: 22px; display: block; }
    .memory-arrow.prev { left: 16px; }
    .memory-arrow.next { right: 16px; }

    /* ===== 页脚 ===== */
    footer { background: linear-gradient(124deg, #6E0B3E 0%, #A11254 50%, #C2185B 100%); color: #ffd7e6; }
    .footer-grid {
      max-width: 1200px; margin: 0 auto; padding: 130px 24px 116px;
      display: grid; grid-template-columns: 1.2fr 2fr 1fr; gap: 40px;
    }
    .footer-brand img { display: block; margin-bottom: 14px; height: 110px; width: auto; }
    .footer-brand .zh { font-size: 22px; font-weight: 700; color: #fff; }
    .footer-brand .en { font-size: 12px; letter-spacing: 2px; color: #f0a9c6; margin-top: 4px; }
    .footer-info p { font-size: 14px; margin-bottom: 12px; color: #ffd7e6; }
    .footer-info .label { color: #f0a9c6; margin-right: 8px; }
    .footer-copy { border-top: 1px solid rgba(255,255,255,.18); padding: 20px 24px; text-align: center; font-size: 13px; color: #f0a9c6; }
    .footer-qr { text-align: center; }
    .footer-qr h4 { color: #fff; font-size: 16px; margin-bottom: 16px; }
    .qr-box { display: flex; gap: 16px; justify-content: center; }
    .qr-item .qr {
      width: 92px; height: 92px; background: #fff; border-radius: 6px;
      display: flex; align-items: center; justify-content: center; color: var(--deep-blue);
      font-size: 11px; text-align: center; padding: 6px; margin-bottom: 8px;
    }
    .qr-item p { font-size: 13px; color: #ffd7e6; }
    .foot-contact {
      display: block; margin-top: 18px; text-align: left;
      color: #ffd7e6; font-size: 14px; text-decoration: none;
    }
    .foot-contact:hover { color: #ffffff; }

    @media (max-width: 900px) {
      .story-grid, .footer-grid, .proj-grid, .adv-grid { grid-template-columns: 1fr; }
      .banner--split .banner-grid { flex-direction: column; padding: 40px 0 60px; }
      .banner--split .banner-text { justify-content: flex-start; padding-top: 0; }
      .banner--split .banner-media { min-height: 0; position: relative; }
      .banner--split .banner-photo { position: static; width: 100%; margin-top: 24px; }
      .banner--split .banner-pattern { display: none; }
    }
  </style>
</head>

  // 内容集合（图文内容仓库），模拟后端集合数据。

  // 页面配置：一块有序块列表，后端可自由增删改。
  const pageConfig = {
    title: "首页",
    nav: {
      logo: "img/pink_logo_with_text_1.jpg",
      langCurrent: "中文", langOther: "EN",
      items: [
        { label: "首页", link: "index.html", active: true },
        { label: "关于中惠", link: "about.html" },
        { label: "互惠生", link: "#" },
        { label: "赴美J1交流项目", link: "project-swt.html", children: [
            { label: "SWT 赴美带薪实习", link: "project-swt.html" },
            { label: "ITP 赴美专业实习", link: "#" },
            { label: "ICCP 赴美营地辅导员", link: "#" } ] },
        { label: "海外留学", link: "#" },
        { label: "案例分享", link: "cases.html" },
        { label: "联系我们", link: "contact.html" }
      ]
    },
    footer: {
      logo: "img/footLogo.png",
      info: [
        { label: "📍 地址：", text: "北京东城区绿景馨园东区12号楼" },
        { label: "📞 电话：", text: "010-64159286" },
        { label: "✉ 邮箱：", text: "info@zhonghui.com" },
        { label: "🌐 中文官网：", text: "www.chinaaupairs.com" },
        { label: "🌐 英文官网：", text: "www.aupaircn.com" }
      ],
      qrcodes: [
        { title: "公众号",     text: "公众号\n二维码" },
        { title: "咨询微信",   text: "咨询微信\n二维码" },
        { title: "视频号",     text: "视频号\n二维码" }
      ],
      copyright: "Copyright © 2026 中惠文化　·　京ICP备XXXXXXXX号"
    },
    blocks: [
      // ① Banner 块：options.layout 选预制布局变体（split / centered）
      { type: "banner",
        data: { headline: "覆盖美国、欧洲、英国、澳洲的文化交流、工作与留学项目", sub: "无论你的目标是什么，都有合适的项目为你规划" },
        options: { layout: "split", image: "img/banner-hero.jpg", pattern: "img/pattern-box-5.svg" } },

      // ② 项目一览矩阵块：3×3 卡片，图片 + 标题 + 描述
      { type: "project-grid",
        data: { title: "项目一览",
          items: [
            { img: "img/prog-au-pair-usa.jpg", title: "美国 AuPair", desc: "深入美国家庭，边体验边学习" },
            { img: "img/prog-au-pair-eu.jpg",  title: "欧洲 AuPair", desc: "融入欧洲家庭，拓展国际视野" },
            { img: "img/prog-swt.jpg",         title: "赴美 SWT",   desc: "暑假赴美带薪实习，用工作换旅行" },
            { img: "img/prog-itp.jpg",         title: "赴美 ITP",   desc: "对口专业实习，为履历镀金" },
            { img: "img/prog-iccp.jpg",        title: "赴美 ICCP",  desc: "在美式营地当辅导员，收获成长" },
            { img: "img/prog-laihua.jpg",      title: "来华",        desc: "文化交流与来华项目" },
            { img: "img/prog-uk-study.jpg",    title: "英国留学",    desc: "英伦名校，开启留学之旅" },
            { img: "img/prog-iccp.jpg",        title: "澳洲留学",    desc: "南半球留学体验" },
            { img: "img/prog-us-study.jpg",    title: "美国留学",    desc: "美国名校留学申请" } ] },
        options: { columns: 3, alt: false, bg: "img/yinji-bg.jpg" } },

      // ③ 中惠优势：2×4 图标网格
      { type: "advantage-grid",
        data: { title: "中惠优势",
          items: [
            { icon: "badge", title: "资质齐全", desc: "官方认可资质\n合规规范运营\n全流程受监管" },
            { icon: "globe", title: "深耕国际交流", desc: "多年专注国际交流\n项目经验丰富\n资源持续积累" },

            { icon: "reputation", title: "口碑见证", desc: "学员真实好评\n往届案例可查\n家长放心之选" } ] },
        options: { columns: 4, alt: true } },

      // ④ 中惠印记：Swiper 封面流轮播
      { type: "memory-slider",
        data: { title: "中惠印记",
          images: [
            "img/memory-1.png", "img/memory-2.jpg", "img/memory-3.jpg",
            "img/memory-4.jpg", "img/memory-5.jpg", "img/memory-6.jpg",
            "img/memory-7.jpg", "img/memory-8.png", "img/memory-9.jpg",
            "img/memory-10.jpg" ] },
        options: { bg: "img/yinji-bg.jpg" } },

      // ⑤ 故事列表块：自动加载 stories 集合前 limit 条
      { type: "story-list",
        data: { title: "学生分享", source: "stories", limit: 2 },
        options: { cols: 2, alt: true } }
    ]
  };

  // ---------------- 渲染器 ----------------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  // ---------------- 统一区块外壳：支持背景（图/纯色/渐变）与前置背景带 ----------------
  // 把 b.options.bg 转成背景 style 字符串。"" | linear-gradient…/radial-gradient… → 渐变 | #hex/var()/rgb/hsl/颜色名 → 纯色 | 其余 → 图片
  function bgStyle(bg) {
    if (!bg) return "";
    const v = String(bg).trim();
    if (/^(linear-gradient|radial-gradient)/i.test(v)) return `style="background:${v};"`;
    if (/^(#|var\(|rgb|hsl)/i.test(v)) return `style="background:${v};"`;
    if (/\/|\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(v)) return `style="background-image:url('${esc(v)}');background-size:cover;background-position:center;"`;
    return `style="background:${v};"`;
  }

  function shell(b, innerHtml) {
    const bg = b.options.bg || "";
    const style = bgStyle(bg);
    const cls = ["section"];
    if (!style && b.options.alt) cls.push("section-alt");
    return `<section class="${cls.join(" ")}" ${style}>${innerHtml}</section>`;
  }

  // 优势图标（内联 SVG，stroke=currentColor，颜色由 CSS 的 --accent 控制）
  const advIcons = {
    badge:      '<circle cx="12" cy="9" r="5.5"/><path d="M8.6 13.8 7 22l5-2.8 5 2.8-1.6-8.2"/>',
    globe:      '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 3 2.6 15 0 18M12 3c-2.6 3-2.6 15 0 18"/>',
    service:    '<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 12 2 2 4-4"/>',
    network:    '<circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M12 7.2 6.4 16M12 7.2 17.6 16M7.2 18h9.6"/>',
    visa:       '<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="9.5" r="2.4"/><path d="m9 12.5 2 2 4-4"/>',
    safety:     '<path d="M12 3 5 6v6c0 4 3 7 7 9 4-2 7-5 7-9V6l-7-3z"/><path d="m9 12 2 2 4-4"/>',
    team:       '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.6a3 3 0 0 1 0 5.8M21 20c0-2.4-1.4-4.5-3.4-5.4"/>',
    reputation: '<path d="m12 3 2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.8L6.6 19.6l1-6L3.3 9.4l6-.9L12 3z"/>'
  };

  const renderers = {
    banner(b) {
      const c = b.data;
      const layout = b.options.layout;
      if (layout === "centered") {
        const inner = `<div class="cover">
          ${c.headline ? `<h1>${esc(c.headline)}</h1>` : ""}
          ${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ""}
        </div>`;
        return shell(b, inner).replace("class=\"section", "class=\"banner banner--centered section");
      }
      const img = b.options.image || "";
      const pattern = b.options.pattern || "";
      const inner = `<div class="container banner-grid">
        <div class="banner-text">
          ${c.headline ? `<h1>${esc(c.headline)}</h1>` : ""}
          ${c.sub ? `<p class="sub">${esc(c.sub)}</p>` : ""}
        </div>
        ${img ? `<div class="banner-media">
          ${pattern ? `<img class="banner-pattern" src="${esc(pattern)}" alt="">` : ""}
          <img class="banner-photo" src="${esc(img)}" alt="${esc(c.headline || '中惠文化')}">
        </div>` : ""}
      </div>`;
      return shell(b, inner).replace("class=\"section", "class=\"banner banner--split section");
    },
    "card-grid"(b) {
      const cols = b.options.columns || 4;
      const cards = b.data.items.map(p => `<div class="prog-card">
          <div class="icon">${esc(p.icon)}</div>
          <h3>${esc(p.title)}</h3>
          <p class="sub">${esc(p.desc)}</p>
          <a class="more" href="${esc(p.link)}">查看详情 →</a>
        </div>`).join("");
      const inner = `<div class="container">
        <div class="section-title"><h2>${esc(b.data.title)}</h2></div>
        <div class="prog-grid" style="grid-template-columns:repeat(${cols},1fr);">${cards}</div>
      </div>`;
      return shell(b, inner);
    },
    "story-list"(b) {
      const src = b.data.source;
      const list = (collections[src] || []).slice(0, b.data.limit);
      if (!list.length) return "";
      const cols = b.options.cols || 2;
      const cards = list.map(s => {
        const bg = s.cover && s.cover.indexOf("linear-gradient") === -1
          ? `background-image:url('${esc(s.cover)}');`
          : `background:${s.cover};`;
        return `<a class="story-card" href="${esc(s.link)}">
          <div class="thumb" style="${bg}">
            ${s.tag ? `<span class="tag">${esc(s.tag)}</span>` : ""}
          </div>
          <div class="body"><h3>${esc(s.title)}</h3><p>${esc(s.intro)}</p><span class="read">阅读全文</span></div>
        </a>`;
      }).join("");
      const inner = `<div class="container">
        <div class="section-title"><h2>${esc(b.data.title)}</h2></div>
        <div class="story-grid" style="grid-template-columns:repeat(${cols},1fr);">${cards}</div>
      </div>`;
      return shell(b, inner);
    },
    "project-grid"(b) {
      const cols = b.options.columns || 3;
      const cards = b.data.items.map(p => `<div class="proj-card">
        <div class="ph"><img src="${esc(p.img)}" alt="${esc(p.title)}"></div>
        <div class="proj-body"><h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p></div>
      </div>`).join("");
      const inner = `<div class="container">
        <div class="section-title title-on-image"><h2>${esc(b.data.title)}</h2></div>
        <div class="proj-grid" style="grid-template-columns:repeat(${cols},1fr);">${cards}</div>
      </div>`;
      return shell(b, inner);
    },
    "advantage-grid"(b) {
      const cols = b.options.columns || 4;
      const cards = b.data.items.map(p => `<div class="adv-card">
        <div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${advIcons[p.icon] || ""}</svg></div>
        <h3>${esc(p.title)}</h3>
        <p>${esc(p.desc).replace(/\n/g, "<br>")}</p>
      </div>`).join("");
      const inner = `<div class="container">
        <div class="section-title"><h2>${esc(b.data.title)}</h2></div>
        <div class="adv-grid" style="grid-template-columns:repeat(${cols},1fr);">${cards}</div>
      </div>`;
      return shell(b, inner);
    },
    "memory-slider"(b) {
      const imgs = (b.data.images || []).map(src =>
        `<div class="swiper-slide"><a href="#"><div class="slide-inner"><img src="${esc(src)}" alt="${esc(b.data.title)}"></div></a></div>`).join("");
      const inner = `<div class="container">
        <div class="section-title title-on-image"><h2>${esc(b.data.title)}</h2></div>
        <div class="swiper memory-swiper">
          <div class="swiper-wrapper">${imgs}</div>
          <span class="memory-arrow prev"><svg viewBox="0 0 27 44"><path d="M0,22L22,0l4.2,4.2L8.4,22l17.8,17.8L22,44L0,22z" fill="#fff"></path></svg></span>
          <span class="memory-arrow next"><svg viewBox="0 0 27 44"><path d="M0,22L22,0l4.2,4.2L8.4,22l17.8,17.8L22,44L0,22z" transform="rotate(180 13.5 22)" fill="#fff"></path></svg></span>
        </div>
      </div>`;
      return shell(b, inner).replace("class=\"section", "class=\"memory-slider section");
    }
  };

  // ---------------- 渲染页面 ----------------
  function renderNav(nav) {
    const menu = nav.items.map(m => {
      const sub = m.children ? `<div class="dropdown">${m.children.map(c =>
        `<a href="${esc(c.link)}">${esc(c.label)}</a>`).join("")}</div>` : "";
      return `<li${m.children ? ' class="has-sub"' : ""}>
        <a href="${esc(m.link)}" class="${m.active ? "active" : ""}">${esc(m.label)}${m.children ? ' <span class="caret">▾</span>' : ""}</a>
        ${sub}</li>`;
    }).join("");
    document.getElementById("site-header").innerHTML = `
      <div class="container nav">
        <a class="logo" href="index.html"><img src="${esc(nav.logo)}" alt="中惠文化"></a>
        <div class="nav-right">
          <ul class="nav-menu">${menu}</ul>
          <div class="nav-lang"><a class="active" href="#">${esc(nav.langCurrent)}</a><span class="sep">|</span><a href="#">${esc(nav.langOther)}</a></div>
        </div>
      </div>`;
  }

  function renderBlocks(blocks) {
    document.getElementById("page").innerHTML = blocks
      .filter(b => renderers[b.type])
      .map(b => renderers[b.type](b)).join("");
  }

  function renderFooter(f) {
    const info = f.info.map(i => `<p><span class="label">${esc(i.label)}</span>${esc(i.text)}</p>`).join("");
    const qr = f.qrcodes.map(q => `
      <div class="qr-item"><div class="qr">${esc(q.text).replace(/\n/g,"<br>")}</div></div>`).join("");
    document.getElementById("site-footer").innerHTML = `
      <div class="footer-grid">
        <div class="footer-brand"><img src="${esc(f.logo)}" alt="中惠文化"></div>
        <div class="footer-info">${info}</div>
        <div class="footer-qr"><div class="qr-box">${qr}</div><a class="foot-contact" href="contact.html">联系我们</a></div>
      </div>
      <div class="footer-copy">${esc(f.copyright)}</div>`;
  }

  renderNav(pageConfig.nav);
  renderBlocks(pageConfig.blocks);
  renderFooter(pageConfig.footer);

  // 中惠印记：Swiper 3D 封面流
  if (window.Swiper) {
    new Swiper('.memory-swiper', {
      slidesPerView: 2,
      centeredSlides: true,
      loop: true,
      grabCursor: true,
      watchOverflow: false,
      navigation: { nextEl: '.memory-swiper .next', prevEl: '.memory-swiper .prev' },
      breakpoints: {
        320: { slidesPerView: 1 },
        900: { slidesPerView: 2 }
      }
    });
  }
  </script>
</body>
</html>
